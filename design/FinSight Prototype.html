<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FinSight — 프로토타입</title>
<link rel="stylesheet" href="_ds/finsight-design-system-9bfd031f-fc92-42be-991a-dbcfb5e2b6cb/tokens/fonts.css">
<link rel="stylesheet" href="_ds/finsight-design-system-9bfd031f-fc92-42be-991a-dbcfb5e2b6cb/tokens/colors.css">
<link rel="stylesheet" href="_ds/finsight-design-system-9bfd031f-fc92-42be-991a-dbcfb5e2b6cb/tokens/typography.css">
<link rel="stylesheet" href="_ds/finsight-design-system-9bfd031f-fc92-42be-991a-dbcfb5e2b6cb/tokens/spacing.css">
<link rel="stylesheet" href="_ds/finsight-design-system-9bfd031f-fc92-42be-991a-dbcfb5e2b6cb/tokens/radius.css">
<link rel="stylesheet" href="_ds/finsight-design-system-9bfd031f-fc92-42be-991a-dbcfb5e2b6cb/tokens/shadows.css">
<link rel="stylesheet" href="_ds/finsight-design-system-9bfd031f-fc92-42be-991a-dbcfb5e2b6cb/styles.css">
<link rel="stylesheet" href="finsight-dark.css">
<style>@keyframes fsPulse{0%,100%{opacity:1}50%{opacity:.25}}</style>
<style id="__om-edit-overrides"></style>
</head>
<body>
<template id="__bundler_thumbnail" data-bg-color="#0e1014">
<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg"><rect width="1200" height="800" fill="#0e1014"/><circle cx="600" cy="380" r="180" fill="none" stroke="#232833" stroke-width="64"/><circle cx="600" cy="380" r="180" fill="none" stroke="#3ecf8e" stroke-width="64" stroke-dasharray="700 431" stroke-linecap="butt" transform="rotate(-90 600 380)"/><text x="600" y="640" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="76" font-weight="800" fill="#f1f3f8" letter-spacing="-2">finsight</text></svg>
</template>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="_ds/finsight-design-system-9bfd031f-fc92-42be-991a-dbcfb5e2b6cb/_ds_bundle.js"></script>
<script src="finsight-data.js"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="finsight-parts.jsx"></script>
<script type="text/babel" src="finsight-dashboard.jsx"></script>
<script type="text/babel" src="finsight-screens.jsx"></script>
<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "#3ecf8e",
  "plan": "pro"
}/*EDITMODE-END*/;

const ROUTES = [
  { id: 'landing', label: '랜딩' },
  { id: 'empty', label: '빈 상태' },
  { id: 'upload', label: '업로드' },
  { id: 'dash', label: '대시보드' },
  { id: 'mobile', label: '모바일' },
];

function Switcher({ route, go }) {
  return (
    <div className="fs-switcher">
      {ROUTES.map(r => (
        <button key={r.id} data-on={route === r.id ? '1' : '0'} onClick={() => go(r.id)}>{r.label}</button>
      ))}
    </div>
  );
}

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [route, setRoute] = React.useState(() => localStorage.getItem('fs_route') || 'landing');
  const go = id => { setRoute(id); localStorage.setItem('fs_route', id); window.scrollTo(0, 0); };
  React.useEffect(() => { document.documentElement.style.setProperty('--accent', t.accent); }, [t.accent]);
  const plan = t.plan, setPlan = v => setTweak('plan', v);
  let screen;
  if (route === 'landing') screen = <Landing go={go} />;
  else if (route === 'empty') screen = <EmptyState go={go} />;
  else if (route === 'upload') screen = <Upload go={go} />;
  else if (route === 'mobile') screen = <MobileScreens plan={plan} setPlan={setPlan} />;
  else screen = <Dashboard go={go} plan={plan} setPlan={setPlan} />;
  return (
    <>
      {screen}
      <Switcher route={route} go={go} />
      <TweaksPanel>
        <TweakSection label="브랜드" />
        <TweakColor label="포인트 컬러" value={t.accent}
          options={['#4b7bff', '#3ecf8e', '#f5b642', '#c084fc']}
          onChange={v => setTweak('accent', v)} />
        <TweakSection label="플랜" />
        <TweakRadio label="구독 상태" value={t.plan} options={['free', 'pro']}
          onChange={v => setTweak('plan', v)} />
      </TweaksPanel>
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
